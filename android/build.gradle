group = "com.deinticketshop.sunmi_printerx"
version = "1.0"

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:7.3.0")
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"

android {
    buildFeatures {
        aidl true
    }
    if (project.android.hasProperty("namespace")) {
        namespace = "com.deinticketshop.sunmi_printerx"
    }


    aidlPackageWhiteList "src/main/aidl/com/sunmi/statuslampmanager/IStateLamp.aidl"


    compileSdk = 34

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        minSdk = 21
    }

    dependencies {
        testImplementation("junit:junit:4.13.2")
        testImplementation("org.mockito:mockito-core:5.0.0")
        implementation 'com.sunmi:printerx:1.0.18'
        implementation fileTree(dir: 'libs', include: ['*.jar'])
        implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.10'
    }

    testOptions {
        unitTests.all {
            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}
